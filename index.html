<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Veta & Vigor</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      // OneSignalDeferred no garantiza esperar a un callback asíncrono antes de
      // ejecutar el siguiente, así que no alcanza con hacerlo async: login() se
      // adelantaba a init() y fallaba con "Cannot read properties of undefined".
      // Exponemos una promesa que resuelve recién cuando init() termino de verdad,
      // y la app hace login sobre ella.
      window.oneSignalListo = new Promise(function(resolve, reject) {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.init({
              appId: "f0e7f7a8-6da8-4592-92a7-542f731a91f0"
            });
            resolve(OneSignal);
          } catch (e) {
            reject(e);
          }
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
